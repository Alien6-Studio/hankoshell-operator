name: Go test history
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: read
concurrency:
  group: go-test-history
  cancel-in-progress: false
jobs:
  report:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compare outcomes on identical commits without retrying tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.qualification.reporting.flaky_report --runs 20 --output "$RUNNER_TEMP/go-test-history"
      - name: Preserve the report and its missing-evidence inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-history/
          if-no-files-found: error
          retention-days: 30
  issue:
    name: Flaky-test tracking issue
    needs: [report]
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-test-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-history
      - name: Open, update or close the flaky-test tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Flaky Go tests on main
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/go-test-history"
          body="$RUNNER_TEMP/flaky-issue.md"
          jq -e '.schema == 1 and (.mixed_outcomes | type == "array")' "$report/flaky.json" > /dev/null
          printf 'History: %s/%s/actions/runs/%s\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$body"
          cat "$report/summary.md" >> "$body"
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci --limit 100 --json number,title)
          number=$(jq -r 'if length >= 100 then error("Issue inventory truncated") else [.[] | select(.title == env.ISSUE_TITLE) | .number] | sort | first // "" end' <<< "$issues")
          if jq -e '.mixed_outcomes | length > 0' "$report/flaky.json" > /dev/null; then
            if test -n "$number"; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label ci --body-file "$body"
            fi
          elif test -n "$number"; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "No mixed outcome in the available comparable reports. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
