name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub-verified signed annotated public release tag on verified main (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: operator-release
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    outputs:
      tag_object: ${{ steps.identity.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require public launch, GitHub-verified commit and signed annotated tag
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m tools.release.release_eligibility
  quality:
    needs: eligibility
    permissions:
      contents: read
      packages: read
      # Required by reusable CI's scheduled reporter, even when that job is skipped.
      issues: write
    uses: ./.github/workflows/ci.yml
    with:
      release: true
  publish:
    needs: [eligibility, quality]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck exact verified commit and signed annotated tag before publication
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.eligibility.outputs.tag_object }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.release.release_eligibility
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install metadata dependencies and pinned OCI publisher
        run: |
          python3 -m pip install -r tools/requirements.txt
          GOBIN="$RUNNER_TEMP/hankoshell-release-tools" go install "oras.land/oras/cmd/oras@$(python3 -m tools.versions get tools oras)"
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release identity
        env:
          TAG: ${{ inputs.tag }}
          HANKOSHELL_ATTEST_SIGNING_KEY: ${{ secrets.HANKOSHELL_ATTEST_SIGNING_KEY }}
          HANKOSHELL_ATTEST_KEY_ID: ${{ vars.HANKOSHELL_ATTEST_KEY_ID }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ATTEST_TSA_URL: ${{ vars.HANKOSHELL_ATTEST_TSA_URL }}
          HANKOSHELL_ATTEST_TSA_CERTIFICATE: ${{ vars.HANKOSHELL_ATTEST_TSA_CERTIFICATE }}
          HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID: ${{ vars.HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          python3 -m tools.bootstrap.install attest --directory "$RUNNER_TEMP/hankoshell-attest"
          python3 -m tools.release.attest_release --check-config --attest "$RUNNER_TEMP/hankoshell-attest/attest"
          python3 -m tools.release.release_metadata --check-config
          version="$(python3 -m tools.release.release_version "$TAG")"
          python3 -m tools.qualification.checks.release_contract check --version "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo 'IMAGE=ghcr.io/alien6-studio/hankoshell-operator' >> "$GITHUB_ENV"
      - name: Download the immutable scanned OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.oci_artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Restore the committed delivery for an interrupted retry
        id: checkpoint
        env:
          CANDIDATE_DIGEST: ${{ needs.quality.outputs.image_digest }}
        run: |
          python3 -m tools.release.release_publish restore --root "$RUNNER_TEMP/hankoshell-delivery" \
            --candidate-digest "$CANDIDATE_DIGEST" \
            --version "$VERSION" --revision "$GITHUB_SHA" \
            --oras "$RUNNER_TEMP/hankoshell-release-tools/oras" --helm /tmp/linux-amd64/helm
      - name: Select one immutable delivery
        env:
          RESTORED: ${{ steps.checkpoint.outputs.restored }}
          RESTORED_DIGEST: ${{ steps.checkpoint.outputs.digest }}
          BUILT_DIGEST: ${{ needs.quality.outputs.oci_digest }}
        run: |
          if test "$RESTORED" = true; then
            echo "DIGEST=$RESTORED_DIGEST" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/hankoshell-delivery"
            cp "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" "$RUNNER_TEMP/hankoshell-delivery/image.tar"
            echo "DIGEST=$BUILT_DIGEST" >> "$GITHUB_ENV"
          fi
      - name: Verify scan binding and upload a non-release staging reference
        if: steps.checkpoint.outputs.restored != 'true'
        run: |
          python3 -m tools.release.oci_security verify --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --output "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" \
            --digest "$DIGEST" --revision "$GITHUB_SHA" --version "$VERSION"
          "$RUNNER_TEMP/hankoshell-release-tools/oras" cp --from-oci-layout \
            "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar@$DIGEST" \
            "$IMAGE:staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$("$RUNNER_TEMP/hankoshell-release-tools/oras" resolve "$IMAGE:staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")" = "$DIGEST"
      - name: Sign exact image and package the chart
        if: steps.checkpoint.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID: ${{ vars.HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          bash tools/bootstrap/install_cosign.sh /tmp/cosign
          /tmp/cosign sign --yes -a "hanko.git.revision=$GITHUB_SHA" "$IMAGE@$DIGEST"
          /tmp/cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            -a "hanko.git.revision=$GITHUB_SHA" "$IMAGE@$DIGEST"
          python3 -m tools.qualification.checks.release_contract prepare --version "$VERSION" --image "$IMAGE@$DIGEST" \
            --revision "$GITHUB_SHA" --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" \
            --chart-output "$RUNNER_TEMP/hankoshell-release-chart/hankoshell-operator" --dist "$RUNNER_TEMP/hankoshell-delivery/dist" \
            --helm /tmp/linux-amd64/helm
          /tmp/cosign sign-blob --yes --bundle "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.sigstore.json" "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.txt"
          /tmp/cosign verify-blob --bundle "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.txt"
      - name: Sign, timestamp and verify the delivery with Continuum Attest
        if: steps.checkpoint.outputs.restored != 'true'
        env:
          HANKOSHELL_ATTEST_SIGNING_KEY: ${{ secrets.HANKOSHELL_ATTEST_SIGNING_KEY }}
          HANKOSHELL_ATTEST_KEY_ID: ${{ vars.HANKOSHELL_ATTEST_KEY_ID }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ATTEST_TSA_URL: ${{ vars.HANKOSHELL_ATTEST_TSA_URL }}
          HANKOSHELL_ATTEST_TSA_CERTIFICATE: ${{ vars.HANKOSHELL_ATTEST_TSA_CERTIFICATE }}
        run: |
          python3 -m tools.bootstrap.install attest --directory "$RUNNER_TEMP/hankoshell-attest"
          python3 -m tools.release.attest_release --attest "$RUNNER_TEMP/hankoshell-attest/attest" \
            --dist "$RUNNER_TEMP/hankoshell-delivery/dist" --workspace "$RUNNER_TEMP/hankoshell-attest-delivery" \
            --output "$RUNNER_TEMP/hankoshell-delivery/release-evidence" --revision "$GITHUB_SHA" --version "$VERSION" \
            --image "$IMAGE@$DIGEST" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hankoshell-attest-delivery/.attest/keys/"*.key
      - name: Prepare the local checkpoint manifest
        if: steps.checkpoint.outputs.restored != 'true'
        run: |
          python3 -m tools.release.release_publish manifest --root "$RUNNER_TEMP/hankoshell-delivery" \
            --image "$IMAGE@$DIGEST" --version "$VERSION" --revision "$GITHUB_SHA" \
            --oras "$RUNNER_TEMP/hankoshell-release-tools/oras" --helm /tmp/linux-amd64/helm
      - name: Revalidate the committed image and delivery on every attempt
        env:
          HANKOSHELL_ATTEST_KEY_ID: ${{ vars.HANKOSHELL_ATTEST_KEY_ID }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ATTEST_TSA_CERTIFICATE: ${{ vars.HANKOSHELL_ATTEST_TSA_CERTIFICATE }}
        run: |
          bash tools/bootstrap/install_cosign.sh /tmp/cosign
          python3 -m tools.bootstrap.install attest --directory "$RUNNER_TEMP/hankoshell-attest"
          python3 -m tools.bootstrap.install trivy --directory "$RUNNER_TEMP"
          python3 -m tools.release.oci_security scan --archive "$RUNNER_TEMP/hankoshell-delivery/image.tar" \
            --output "$RUNNER_TEMP/fresh-scan" --scanner "$RUNNER_TEMP/trivy" \
            --digest "$DIGEST" --revision "$GITHUB_SHA" --version "$VERSION"
          /tmp/cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            -a "hanko.git.revision=$GITHUB_SHA" "$IMAGE@$DIGEST"
          /tmp/cosign verify-blob --bundle "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            "$RUNNER_TEMP/hankoshell-delivery/dist/checksums.txt"
          python3 -m tools.release.release_publish verify-attest --root "$RUNNER_TEMP/hankoshell-delivery" \
            --version "$VERSION" --revision "$GITHUB_SHA" --attest "$RUNNER_TEMP/hankoshell-attest/attest" \
            --oras "$RUNNER_TEMP/hankoshell-release-tools/oras" --helm /tmp/linux-amd64/helm
      - name: Preserve current-attempt image revalidation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-revalidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fresh-scan
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit the verified delivery before promotion
        run: |
          python3 -m tools.release.release_publish save --root "$RUNNER_TEMP/hankoshell-delivery" \
            --image "$IMAGE@$DIGEST" --version "$VERSION" --revision "$GITHUB_SHA" \
            --oras "$RUNNER_TEMP/hankoshell-release-tools/oras" --helm /tmp/linux-amd64/helm
      - name: Resume publication without replacing existing content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | /tmp/linux-amd64/helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 -m tools.release.release_publish promote --root "$RUNNER_TEMP/hankoshell-delivery" \
            --version "$VERSION" --revision "$GITHUB_SHA" \
            --oras "$RUNNER_TEMP/hankoshell-release-tools/oras" --helm /tmp/linux-amd64/helm
