name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed SemVer tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: operator-release
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Require public launch and an existing reviewed tag
        env:
          PRIVATE: ${{ github.event.repository.private }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$PRIVATE" = false || { echo 'Publication is disabled during private harmonization.'; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$REF" = "refs/tags/$TAG" || { echo 'Run this workflow from the reviewed tag itself.'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" --jq '.enabled')" = true || {
            echo 'Enable GitHub private vulnerability reporting before releasing.'; exit 1;
          }
  quality:
    needs: eligibility
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metadata dependencies and pinned OCI publisher
        run: |
          python3 -m pip install -r scripts/requirements.txt
          GOBIN="$RUNNER_TEMP/hankoshell-release-tools" go install oras.land/oras/cmd/oras@v1.3.4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release identity
        env:
          TAG: ${{ inputs.tag }}
          HANKOSHELL_ATTEST_SIGNING_KEY: ${{ secrets.HANKOSHELL_ATTEST_SIGNING_KEY }}
          HANKOSHELL_ATTEST_KEY_ID: ${{ vars.HANKOSHELL_ATTEST_KEY_ID }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ATTEST_TSA_URL: ${{ vars.HANKOSHELL_ATTEST_TSA_URL }}
          HANKOSHELL_ATTEST_TSA_CERTIFICATE: ${{ vars.HANKOSHELL_ATTEST_TSA_CERTIFICATE }}
          HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID: ${{ vars.HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          python3 scripts/attest-release.py --check-config
          python3 scripts/release-metadata.py --check-config
          version="${TAG#v}"
          grep -Fx "version: $version" charts/hankoshell-operator/Chart.yaml
          grep -Fx "appVersion: \"$version\"" charts/hankoshell-operator/Chart.yaml
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo 'IMAGE=ghcr.io/alien6-studio/hankoshell-operator' >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/Alien6-Studio/hankoshell-operator
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Sign exact image and package the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ inputs.tag }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID: ${{ vars.HANKOSHELL_ARTIFACTHUB_REPOSITORY_ID }}
        run: |
          bash scripts/install-cosign.sh /tmp/cosign
          /tmp/cosign sign --yes -a "hanko.git.revision=$GITHUB_SHA" "$IMAGE@$DIGEST"
          /tmp/cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            -a "hanko.git.revision=$GITHUB_SHA" "$IMAGE@$DIGEST"
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          mkdir -p dist
          python3 scripts/release-metadata.py --version "$VERSION" --image "$IMAGE@$DIGEST" \
            --chart-output "$RUNNER_TEMP/hankoshell-release-chart/hankoshell-operator" --dist dist
          /tmp/linux-amd64/helm package "$RUNNER_TEMP/hankoshell-release-chart/hankoshell-operator" -d dist
          printf '%s\n' "$IMAGE@$DIGEST" > dist/image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > dist/source-revision.txt
          (cd dist && sha256sum *.tgz image-digest.txt source-revision.txt artifacthub-repo.yml \
            hankoshell-operator-attest-public-key.pem > checksums.txt)
          /tmp/cosign sign-blob --yes --bundle dist/checksums.sigstore.json dist/checksums.txt
          /tmp/cosign verify-blob --bundle dist/checksums.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" dist/checksums.txt
      - name: Sign, timestamp and verify the delivery with Continuum Attest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          HANKOSHELL_ATTEST_SIGNING_KEY: ${{ secrets.HANKOSHELL_ATTEST_SIGNING_KEY }}
          HANKOSHELL_ATTEST_KEY_ID: ${{ vars.HANKOSHELL_ATTEST_KEY_ID }}
          HANKOSHELL_ATTEST_PUBLIC_KEY: ${{ vars.HANKOSHELL_ATTEST_PUBLIC_KEY }}
          HANKOSHELL_ATTEST_TSA_URL: ${{ vars.HANKOSHELL_ATTEST_TSA_URL }}
          HANKOSHELL_ATTEST_TSA_CERTIFICATE: ${{ vars.HANKOSHELL_ATTEST_TSA_CERTIFICATE }}
        run: |
          bash scripts/install-attest.sh "$RUNNER_TEMP/hankoshell-attest/attest"
          python3 scripts/attest-release.py --attest "$RUNNER_TEMP/hankoshell-attest/attest" \
            --dist dist --workspace "$RUNNER_TEMP/hankoshell-attest-delivery" \
            --output release-evidence --revision "$GITHUB_SHA" --version "$VERSION" \
            --image "$IMAGE@$DIGEST" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/hankoshell-attest-delivery/.attest/keys/"*.key
      - name: Publish the verified chart and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          printf '%s' "$GH_TOKEN" | /tmp/linux-amd64/helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          /tmp/linux-amd64/helm push "dist/hankoshell-operator-$VERSION.tgz" oci://ghcr.io/alien6-studio/charts
          printf '%s' "$GH_TOKEN" | "$RUNNER_TEMP/hankoshell-release-tools/oras" login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          (cd dist && "$RUNNER_TEMP/hankoshell-release-tools/oras" push \
            ghcr.io/alien6-studio/charts/hankoshell-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml)
          gh release create "$TAG" dist/* release-evidence/* --verify-tag --draft \
            --title "hankoShell Operator $TAG" --generate-notes
