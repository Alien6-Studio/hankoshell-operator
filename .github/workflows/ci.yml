          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
      - name: Fetch pinned Keycloak before starting the scenario
        timeout-minutes: 5
        run: make keycloak-fixture-image KEYCLOAK_VERSION=${{ matrix.keycloak }}
      - name: Qualify installed signed Fleet tamper, replay, disconnected recovery and rollback
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 -m tools.qualification.scenarios.fleet_installed_test \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/workload-tools/kind" --kubectl "$RUNNER_TEMP/workload-tools/kubectl" \
            --oras "$RUNNER_TEMP/workload-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/installed-fleet.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: NONPUBLISHABLE-installed-fleet-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-fleet.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed Fleet failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NONPUBLISHABLE-diagnostics-fleet-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-fleet.diagnostics
          if-no-files-found: warn
          retention-days: 7
  checks:
    name: Source and chart checks
    # PRs require the complete matrix. Integration and release reuse its source
    # proof; every installed-image cell remains mandatory for a release.
    needs: [preflight, source, kubernetes, keycloak, keycloak-ordinary, keycloak-extension, keycloak-static, workload, security-fuzz, security-mutations, oci, rehearsal, system, installed-workload, installed-delegation, installed-portable, installed-fleet, installed-transactions, installed-scale-qualification]
    if: always()
    runs-on: ubuntu-24.04
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
      PIPELINE_MODE: ${{ github.event_name == 'push' && 'integration' || inputs.release == true && 'release' || 'full' }}
      QUALIFY_SCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.qualify_scale == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every job declared by this qualification profile
        run: python3 -m tools.release.release_eligibility --check-jobs
      - name: Record the exact source after complete qualification
        if: env.PIPELINE_MODE == 'full'
        run: python3 -m tools.release.release_eligibility --record-source "$RUNNER_TEMP/qualified-source.json"
      - name: Preserve the complete source qualification proof
        if: env.PIPELINE_MODE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-source.json
          if-no-files-found: error
          retention-days: 30
  schedule-report:
    name: Scheduled qualification tracking issue
    needs: [preflight, source, kubernetes, keycloak, keycloak-ordinary, keycloak-extension, keycloak-static, workload, security-fuzz, security-mutations, oci, rehearsal, system, installed-workload, installed-delegation, installed-portable, installed-fleet, installed-transactions, installed-scale-qualification, checks]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.schedule_report_test == true))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Open, update or close the tracking issue from this run's outcome
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RESULTS: ${{ toJSON(needs) }}
          ISSUE_TITLE: Scheduled qualification failed on main
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-issue.md"
          printf 'Qualification: %s/%s/actions/runs/%s\nCommit: %s\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$body"
          jq -er 'to_entries[] | "- `\(.key)`: \(.value.result)"' <<< "$QUALIFICATION_RESULTS" >> "$body"
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci --limit 100 --json number,title)
          number=$(jq -r 'if length >= 100 then error("Issue inventory truncated") else [.[] | select(.title == env.ISSUE_TITLE) | .number] | sort | first // "" end' <<< "$issues")
          if jq -e '.checks.result == "success"' <<< "$QUALIFICATION_RESULTS" > /dev/null; then
            if test -n "$number"; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Scheduled qualification is green again. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif test -n "$number"; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label ci --body-file "$body"
          fi
