name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      oci_digest:
        value: ${{ jobs.oci.outputs.digest }}
      oci_artifact_id:
        value: ${{ jobs.oci.outputs.artifact_id }}
      release_candidate:
        value: ${{ jobs.oci.outputs.candidate_digest }}
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Fast source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned preflight dependencies
        run: |
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r scripts/requirements.txt
          make install-preflight-tools
      - name: Validate formatting, vet, generated schemas and delivery contracts
        run: make preflight
  source:
    name: Source checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Helm and test dependencies
        run: |
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r scripts/requirements.txt
          make install-tools
      - name: Validate unit tests, chart, architecture, lint and vulnerabilities
        run: make test chart-test arch lint vuln
      - name: Cross-compile both Linux architectures
        run: |
          make build GOARCH=amd64
          make build GOARCH=arm64
      - name: Check for exposed credentials
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /src --no-banner --redact
  kubernetes:
    name: Kubernetes ${{ matrix.version }} API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['1.35.0', '1.36.2', '1.37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install pinned Helm
        run: |
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Qualify CRDs, server-side apply, RBAC and Restricted admission
        run: make integration-test KUBERNETES_VERSION=${{ matrix.version }}
      - name: Lint integration test code
        if: matrix.version == '1.37.0'
        run: make lint LINT_BUILD_TAGS=integration
  keycloak:
    name: Keycloak ${{ matrix.version }} Admin API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['26.8.0', '26.7.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
      - name: Qualify reconcilers against the real HTTPS Admin API
        run: make keycloak-integration-test KEYCLOAK_VERSION=${{ matrix.version }}
      - name: Vet and lint Keycloak integration test code
        if: matrix.version == '26.8.0'
        run: |
          go vet -tags=keycloak_integration ./...
          make lint LINT_BUILD_TAGS=keycloak_integration
  workload:
    name: Workload identity KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.7.5', '26.8.0']
        kubernetes: ['1.35.0', '1.36.2', '1.37.0']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Install checksum-pinned Kubernetes fixture tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
      - name: Qualify real projected assertions, expiry, UID recreation and native permissions
        run: |
          python3 scripts/workload-identity-probe.py --keycloak-version '${{ matrix.keycloak }}' \
            --kubernetes-version '${{ matrix.kubernetes }}' --kind "$RUNNER_TEMP/workload-tools/kind" \
            --kubectl "$RUNNER_TEMP/workload-tools/kubectl" --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/workload-identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-identity.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded workload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-identity.diagnostics
          if-no-files-found: warn
          retention-days: 7
  oci:
    needs: [preflight]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/oci-security.yml
    with:
      release: ${{ inputs.release == true }}
  rehearsal:
    name: Release contract dry run
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install verified release rehearsal tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          bash scripts/install-cosign.sh "$RUNNER_TEMP/rehearsal-tools/cosign"
          bash scripts/install-attest.sh "$RUNNER_TEMP/rehearsal-tools/attest"
          GOBIN="$RUNNER_TEMP/rehearsal-tools" go install oras.land/oras/cmd/oras@v1.3.4
      - name: Rehearse the exact scanned delivery without publication
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
        run: |
          python3 scripts/release-dry-run.py --version 0.1.0-dev.0 --revision "$GITHUB_SHA" --digest "$DIGEST" \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" \
            --output "$RUNNER_TEMP/hankoshell-release-dry-run" --helm /tmp/linux-amd64/helm \
            --cosign "$RUNNER_TEMP/rehearsal-tools/cosign" --attest "$RUNNER_TEMP/rehearsal-tools/attest" \
            --openssl /usr/bin/openssl --oras "$RUNNER_TEMP/rehearsal-tools/oras"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hankoshell-release-dry-run
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded release fixture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hankoshell-release-dry-run/NONPUBLISHABLE-diagnostics
          if-no-files-found: warn
          retention-days: 7
  system:
    name: Installed operator system test
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned system fixtures
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/system-tools"
          GOBIN="$RUNNER_TEMP/system-tools" go install oras.land/oras/cmd/oras@v1.3.4
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
      - name: Install and exercise the exact scanned operator with real Kubernetes and HTTPS Keycloak
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
        run: |
          python3 scripts/system-test.py --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/system-test.json" --kind "$RUNNER_TEMP/system-tools/kind" \
            --kubectl "$RUNNER_TEMP/system-tools/kubectl" --oras "$RUNNER_TEMP/system-tools/oras" \
            --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-test.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed system failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-test.diagnostics
          if-no-files-found: warn
          retention-days: 7
  installed-workload:
    name: Installed workload KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.7.5', '26.8.0']
        kubernetes: ['1.35.0', '1.36.2', '1.37.0']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned installed workload tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
          GOBIN="$RUNNER_TEMP/workload-tools" go install oras.land/oras/cmd/oras@v1.3.4
          curl -fLsS https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz -o /tmp/helm.tgz
          echo 'fb5d12662fde6eeff36ac4ccacbf3abed96b0ee2de07afdde4edb14e613aee24  /tmp/helm.tgz' | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
      - name: Qualify installed Pod authentication, independent UMA decisions and recovery
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          deep=()
          if test "$KUBERNETES_VERSION" = '1.37.0'; then deep=(--deep-migration); fi
          python3 scripts/workload-installed-test.py \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" "${deep[@]}" \
            --kind "$RUNNER_TEMP/workload-tools/kind" --kubectl "$RUNNER_TEMP/workload-tools/kubectl" \
            --oras "$RUNNER_TEMP/workload-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/installed-workload.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: NONPUBLISHABLE-installed-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-workload.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed workload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-installed-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-workload.diagnostics
          if-no-files-found: warn
          retention-days: 7
  checks:
    name: Source and chart checks
    needs: [preflight, source, kubernetes, keycloak, workload, oci, rehearsal, system, installed-workload]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require preflight, source, Kubernetes, Keycloak, final OCI, installed system and release rehearsal checks
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
          KEYCLOAK_RESULT: ${{ needs.keycloak.result }}
          WORKLOAD_RESULT: ${{ needs.workload.result }}
          OCI_RESULT: ${{ needs.oci.result }}
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          INSTALLED_WORKLOAD_RESULT: ${{ needs.installed-workload.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$SOURCE_RESULT" = success && test "$KUBERNETES_RESULT" = success && test "$KEYCLOAK_RESULT" = success && test "$WORKLOAD_RESULT" = success && test "$OCI_RESULT" = success && test "$REHEARSAL_RESULT" = success && test "$SYSTEM_RESULT" = success && test "$INSTALLED_WORKLOAD_RESULT" = success
