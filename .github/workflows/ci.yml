name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      oci_digest:
        value: ${{ jobs.oci.outputs.digest }}
      oci_artifact_id:
        value: ${{ jobs.oci.outputs.artifact_id }}
      release_candidate:
        value: ${{ jobs.oci.outputs.candidate_digest }}
  workflow_dispatch:
    inputs:
      schedule_report_test:
        description: Exercise the scheduled-failure tracking issue on this run
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Fast source preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned preflight dependencies
        run: |
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r scripts/requirements.txt
          make install-preflight-tools
      - name: Validate formatting, vet, generated schemas and delivery contracts
        run: make preflight
  source:
    name: Source checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify DCO on every pull-request commit
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-dco.py --base "$DCO_BASE_SHA" --head "$DCO_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY"
      - name: Install pinned Helm and test dependencies
        run: |
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r scripts/requirements.txt
          make install-tools
      - name: Verify architecture decision references
        run: python3 scripts/check-adr-references.py
      - name: Run the same pre-commit hooks as contributors
        env:
          # Upstream hook repositories contain their own synthetic secret tests.
          # Keep dependency caches outside the source checkout scanned below.
          PRE_COMMIT_HOME: ${{ runner.temp }}/hankoshell-pre-commit
        run: make hooks-check
      - name: Compare visible GitHub protections with reviewed exports
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-rulesets.py --live --allow-hidden-bypass
      - name: Validate unit tests, chart, architecture, lint and vulnerabilities
        run: make test chart-test arch lint vuln
      - name: Enforce package and security function coverage floors
        run: python3 scripts/check-coverage.py --profile .tools/test-results/unit/coverage.out
      - name: Enforce the dependency license policy and shipped notices
        run: make licenses
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-tests-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Qualify the real experimental authentik adapter and portable corpus
        run: |
          make authentik-integration-test
          go vet -tags=authentik_integration ./internal/controller
          make lint LINT_BUILD_TAGS=authentik_integration
      - name: Preserve real experimental provider outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-tests-authentik-2026.8.4-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/test-results/authentik-2026.8.4/
          if-no-files-found: error
      - name: Cross-compile both Linux architectures
        run: |
          make build GOARCH=amd64
          make build GOARCH=arm64
      - name: Check for exposed credentials
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /src --no-banner --redact
  kubernetes:
    name: Kubernetes ${{ matrix.version }} API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Helm
        run: |
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Qualify CRDs, server-side apply, RBAC and Restricted admission
        run: make integration-test KUBERNETES_VERSION=${{ matrix.version }}
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-tests-kubernetes-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Lint integration test code
        if: matrix.version == '1.37.0' # versions:kubernetes-lint
        run: make lint LINT_BUILD_TAGS=integration
  keycloak:
    name: Keycloak ${{ matrix.version }} / ${{ matrix.shard }} Admin API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["26.8.0", "26.7.5"] # versions:keycloak
        shard: [core, adoption, protocols]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Qualify reconcilers against the real HTTPS Admin API
        run: make keycloak-integration-test KEYCLOAK_VERSION=${{ matrix.version }} KEYCLOAK_SHARD=${{ matrix.shard }}
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-tests-keycloak-${{ matrix.version }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Vet and lint Keycloak integration test code
        if: matrix.version == '26.8.0' && matrix.shard == 'core' # versions:keycloak-lint
        run: |
          go vet -tags=keycloak_integration ./...
          make lint LINT_BUILD_TAGS=keycloak_integration
  workload:
    name: Workload identity KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install checksum-pinned Kubernetes fixture tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
      - name: Qualify real projected assertions, expiry, UID recreation and native permissions
        run: |
          python3 scripts/workload-identity-probe.py --keycloak-version '${{ matrix.keycloak }}' \
            --kubernetes-version '${{ matrix.kubernetes }}' --kind "$RUNNER_TEMP/workload-tools/kind" \
            --kubectl "$RUNNER_TEMP/workload-tools/kubectl" --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/workload-identity.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-identity.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded workload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-identity.diagnostics
          if-no-files-found: warn
          retention-days: 7
  security-mutations:
    name: Security mutation checks
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every removed protection to fail its targeted test
        run: make security-mutations MUTATION_OUTPUT="$RUNNER_TEMP/security-mutations.json"
      - name: Preserve assertion outcomes without test payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-mutations.json
          if-no-files-found: error
          retention-days: 14
  oci:
    needs: [preflight]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/oci-security.yml
    with:
      release: ${{ inputs.release == true }}
  rehearsal:
    name: Release contract dry run
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install verified release rehearsal tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
          bash scripts/install-cosign.sh "$RUNNER_TEMP/rehearsal-tools/cosign"
          bash scripts/install-attest.sh "$RUNNER_TEMP/rehearsal-tools/attest"
          GOBIN="$RUNNER_TEMP/rehearsal-tools" go install "oras.land/oras/cmd/oras@$(python3 scripts/versions.py get tools oras)"
      - name: Rehearse the exact scanned delivery without publication
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
        run: |
          python3 scripts/release-dry-run.py --version "$(python3 scripts/versions.py get release version)" --revision "$GITHUB_SHA" --digest "$DIGEST" \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" \
            --output "$RUNNER_TEMP/hankoshell-release-dry-run" --helm /tmp/linux-amd64/helm \
            --cosign "$RUNNER_TEMP/rehearsal-tools/cosign" --attest "$RUNNER_TEMP/rehearsal-tools/attest" \
            --openssl /usr/bin/openssl --oras "$RUNNER_TEMP/rehearsal-tools/oras"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hankoshell-release-dry-run
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded release fixture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hankoshell-release-dry-run/NONPUBLISHABLE-diagnostics
          if-no-files-found: warn
          retention-days: 7
  system:
    name: Installed operator system test
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned system fixtures
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/system-tools"
          GOBIN="$RUNNER_TEMP/system-tools" go install "oras.land/oras/cmd/oras@$(python3 scripts/versions.py get tools oras)"
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
      - name: Install and exercise the exact scanned operator with real Kubernetes and HTTPS Keycloak
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
        run: |
          python3 scripts/system-test.py --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/system-test.json" --kind "$RUNNER_TEMP/system-tools/kind" \
            --kubectl "$RUNNER_TEMP/system-tools/kubectl" --oras "$RUNNER_TEMP/system-tools/oras" \
            --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-test.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed system failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-test.diagnostics
          if-no-files-found: warn
          retention-days: 7
  installed-workload:
    name: Installed workload KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned installed workload tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
          GOBIN="$RUNNER_TEMP/workload-tools" go install "oras.land/oras/cmd/oras@$(python3 scripts/versions.py get tools oras)"
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
      - name: Qualify installed Pod authentication, independent UMA decisions and recovery
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          deep=()
          if test "$KUBERNETES_VERSION" = "$(python3 scripts/versions.py get kubernetes deep_migration)"; then deep=(--deep-migration); fi
          python3 scripts/workload-installed-test.py \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" "${deep[@]}" \
            --kind "$RUNNER_TEMP/workload-tools/kind" --kubectl "$RUNNER_TEMP/workload-tools/kubectl" \
            --oras "$RUNNER_TEMP/workload-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/installed-workload.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: NONPUBLISHABLE-installed-workload-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-workload.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed workload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-installed-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-workload.diagnostics
          if-no-files-found: warn
          retention-days: 7
  installed-portable:
    name: Portable KC + authentik / KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned portable test tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
          GOBIN="$RUNNER_TEMP/workload-tools" go install "oras.land/oras/cmd/oras@$(python3 scripts/versions.py get tools oras)"
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
      - name: Qualify the identical intent corpus on both installed providers
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 scripts/portable-installed-test.py \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION"  \
            --kind "$RUNNER_TEMP/workload-tools/kind" --kubectl "$RUNNER_TEMP/workload-tools/kubectl" \
            --oras "$RUNNER_TEMP/workload-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/installed-portable.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: NONPUBLISHABLE-installed-portable-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-portable.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded portable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-installed-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-portable.diagnostics
          if-no-files-found: warn
          retention-days: 7
  installed-fleet:
    name: Installed Fleet KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.0"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/hankoshell-scanned-oci
          merge-multiple: true
      - name: Install checksum-pinned installed Fleet tools
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 scripts/install-system-tools.py "$RUNNER_TEMP/workload-tools"
          GOBIN="$RUNNER_TEMP/workload-tools" go install "oras.land/oras/cmd/oras@$(python3 scripts/versions.py get tools oras)"
          python3 scripts/install-helm.py /tmp/linux-amd64/helm
      - name: Qualify installed signed Fleet tamper, replay, disconnected recovery and rollback
        env:
          DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 scripts/fleet-installed-test.py \
            --archive "$RUNNER_TEMP/hankoshell-scanned-oci/image.tar" \
            --evidence "$RUNNER_TEMP/hankoshell-scanned-oci/evidence" --digest "$DIGEST" --revision "$GITHUB_SHA" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/workload-tools/kind" --kubectl "$RUNNER_TEMP/workload-tools/kubectl" \
            --oras "$RUNNER_TEMP/workload-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/installed-fleet.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: NONPUBLISHABLE-installed-fleet-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-fleet.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve bounded installed Fleet failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONPUBLISHABLE-diagnostics-fleet-KC-${{ matrix.keycloak }}-K8s-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-fleet.diagnostics
          if-no-files-found: warn
          retention-days: 7
  checks:
    name: Source and chart checks
    # Pull requests run the full qualification matrix (ADR-048); this required
    # gate must keep representing every qualification job before merge.
    needs: [preflight, source, kubernetes, keycloak, workload, security-mutations, oci, rehearsal, system, installed-workload, installed-portable, installed-fleet]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require preflight, source, Kubernetes, Keycloak, final OCI, installed system and release rehearsal checks
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
          KEYCLOAK_RESULT: ${{ needs.keycloak.result }}
          WORKLOAD_RESULT: ${{ needs.workload.result }}
          MUTATIONS_RESULT: ${{ needs.security-mutations.result }}
          OCI_RESULT: ${{ needs.oci.result }}
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
          SYSTEM_RESULT: ${{ needs.system.result }}
          INSTALLED_WORKLOAD_RESULT: ${{ needs.installed-workload.result }}
          INSTALLED_PORTABLE_RESULT: ${{ needs.installed-portable.result }}
          INSTALLED_FLEET_RESULT: ${{ needs.installed-fleet.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$SOURCE_RESULT" = success && test "$KUBERNETES_RESULT" = success && test "$KEYCLOAK_RESULT" = success && test "$WORKLOAD_RESULT" = success && test "$MUTATIONS_RESULT" = success && test "$OCI_RESULT" = success && test "$REHEARSAL_RESULT" = success && test "$SYSTEM_RESULT" = success && test "$INSTALLED_WORKLOAD_RESULT" = success && test "$INSTALLED_PORTABLE_RESULT" = success && test "$INSTALLED_FLEET_RESULT" = success
  schedule-report:
    name: Scheduled qualification tracking issue
    needs: [preflight, source, kubernetes, keycloak, workload, security-mutations, oci, rehearsal, system, installed-workload, installed-portable, installed-fleet, checks]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.schedule_report_test == true))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: go-tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-reports
      - name: Open, update or close the tracking issue from this run's outcome
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/schedule-report.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --revision "$GITHUB_SHA" \
            --reports "$RUNNER_TEMP/qualification-reports"
