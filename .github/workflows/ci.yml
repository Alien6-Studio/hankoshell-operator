name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      oci_digest:
        value: ${{ jobs.oci.outputs.digest }}
      oci_artifact_id:
        value: ${{ jobs.oci.outputs.artifact_id }}
      image_digest:
        value: ${{ jobs.oci.outputs.candidate_digest }}
  workflow_dispatch:
    inputs:
      qualify_scale:
        description: Also run the six-cell installed 1000-application scale matrix
        type: boolean
        default: false
      schedule_report_test:
        description: Exercise the scheduled-failure tracking issue on this run
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A manually requested batch must not discard the qualification already running.
  # GitHub retains one pending run; subsequent manual requests replace that pending run.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  installed-scale-qualification:
    name: Scale KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci]
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_scale == true
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.1"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/scale-oci
          merge-multiple: true
      - name: Install checksum-pinned fixture tools
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 -m tools.bootstrap.install kind kubectl --directory "$RUNNER_TEMP/scale-tools"
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
          GOBIN="$RUNNER_TEMP/scale-tools" go install "oras.land/oras/cmd/oras@$(python3 -m tools.versions get tools oras)"
      - name: Fetch pinned Keycloak before starting the scenario
        timeout-minutes: 5
        run: make keycloak-fixture-image KEYCLOAK_VERSION=${{ matrix.keycloak }}
      - name: Run measured scale, overload recovery and leader removal
        env:
          SCALE_PROFILE: scale
          OCI_DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 -m tools.qualification.scenarios.scale_installed_test --profile "$SCALE_PROFILE" --workers 4 \
            --archive "$RUNNER_TEMP/scale-oci/image.tar" --evidence "$RUNNER_TEMP/scale-oci/evidence" \
            --digest "$OCI_DIGEST" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/scale-report" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/scale-tools/kind" --kubectl "$RUNNER_TEMP/scale-tools/kubectl" \
            --oras "$RUNNER_TEMP/scale-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - name: Qualify five-minute API outage and owned-realm cleanup
        env:
          OCI_DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 -m tools.qualification.scenarios.recovery_installed_test \
            --archive "$RUNNER_TEMP/scale-oci/image.tar" --evidence "$RUNNER_TEMP/scale-oci/evidence" \
            --digest "$OCI_DIGEST" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/recovery-report" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/scale-tools/kind" --kubectl "$RUNNER_TEMP/scale-tools/kubectl" \
            --oras "$RUNNER_TEMP/scale-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - name: Preserve successful and incomplete measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NONPUBLISHABLE-scale-${{ matrix.keycloak }}-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scale-report/
            ${{ runner.temp }}/scale-report.diagnostics/
            ${{ runner.temp }}/recovery-report/
            ${{ runner.temp }}/recovery-report.diagnostics/
          if-no-files-found: error
          retention-days: 30
  installed-transactions:
    name: HA transactions KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [source, oci, keycloak-extension]
    runs-on: ubuntu-24.04
    # Transaction recovery and native delegation handoff run serially here.
    # Keep room for both suites and their tools; scenario deadlines stay bounded.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.7.5", "26.8.1"] # versions:workload-keycloak
        kubernetes: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.oci.outputs.artifact_id }}
          path: ${{ runner.temp }}/ha-oci
          merge-multiple: true
      - name: Install checksum-pinned HA fixture tools
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 -m tools.bootstrap.install kind kubectl --directory "$RUNNER_TEMP/ha-tools"
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
          GOBIN="$RUNNER_TEMP/ha-tools" go install "oras.land/oras/cmd/oras@$(python3 -m tools.versions get tools oras)"
      - name: Fetch pinned Keycloak before starting the scenario
        timeout-minutes: 5
        run: make keycloak-fixture-image KEYCLOAK_VERSION=${{ matrix.keycloak }}
      - name: Restore the exact SDK provider for delegation HA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: keycloak-extension-java-${{ matrix.keycloak }}-${{ github.run_id }}
          path: .tools/cache/keycloak-bounded-delegation/
      - name: Qualify transaction recovery and live-holder API partition
        env:
          OCI_DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 -m tools.qualification.scenarios.transactions_installed_test \
            --archive "$RUNNER_TEMP/ha-oci/image.tar" --evidence "$RUNNER_TEMP/ha-oci/evidence" \
            --digest "$OCI_DIGEST" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/transactions-report.json" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/ha-tools/kind" --kubectl "$RUNNER_TEMP/ha-tools/kubectl" \
            --oras "$RUNNER_TEMP/ha-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - name: Qualify four delegation journal phases across two-replica handoff
        if: ${{ !cancelled() }}
        env:
          OCI_DIGEST: ${{ needs.oci.outputs.digest }}
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          python3 -m tools.qualification.scenarios.delegation_installed_test --ha-only \
            --archive "$RUNNER_TEMP/ha-oci/image.tar" --evidence "$RUNNER_TEMP/ha-oci/evidence" \
            --digest "$OCI_DIGEST" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/delegation-ha-report.json" \
            --keycloak-version "$KEYCLOAK_VERSION" --kubernetes-version "$KUBERNETES_VERSION" \
            --kind "$RUNNER_TEMP/ha-tools/kind" --kubectl "$RUNNER_TEMP/ha-tools/kubectl" \
            --oras "$RUNNER_TEMP/ha-tools/oras" --helm /tmp/linux-amd64/helm --openssl /usr/bin/openssl
      - name: Preserve successful and incomplete HA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NONPUBLISHABLE-HA-${{ matrix.keycloak }}-${{ matrix.kubernetes }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/transactions-report.json
            ${{ runner.temp }}/transactions-report.diagnostics/
            ${{ runner.temp }}/delegation-ha-report.json
            ${{ runner.temp }}/delegation-ha-report.diagnostics/
          if-no-files-found: error
          retention-days: 30
  preflight:
    name: Source qualification gate
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name != 'push' && inputs.release != true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the complete qualification of the integrated source
        if: github.event_name == 'push' || inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.release.release_eligibility --qualified-source
      - name: Install pinned preflight dependencies
        if: github.event_name != 'push' && inputs.release != true
        run: |
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r tools/requirements.txt
          make install-preflight-tools
      - name: Validate formatting, vet, generated schemas and delivery contracts
        if: github.event_name != 'push' && inputs.release != true
        run: |
          make preflight
          python3 -m tools.qualification.checks.release_contract check
          python3 - <<'PY'
          from tools.qualification.scenarios.release_system_test import qualify_source_reuse
          qualify_source_reuse()
          PY
  source:
    name: Source checks
    needs: [preflight]
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reuse verified source qualification for the delivery image
        if: inputs.release == true
        run: echo 'The source qualification gate verified the full CI evidence and exact Git tree.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.release != true
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.release != true
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.release != true
        with:
          python-version: '3.12'
      - name: Verify DCO on every pull-request commit
        if: inputs.release != true && (github.event_name == 'pull_request')
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_dco.py --base "$DCO_BASE_SHA" --head "$DCO_HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY"
      - name: Install pinned Helm and test dependencies
        if: inputs.release != true
        run: |
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          python -m pip install -r tools/requirements.txt
          make install-tools
      - name: Run the same pre-commit hooks as contributors
        if: inputs.release != true
        env:
          # Upstream hook repositories contain their own synthetic secret tests.
          # Keep dependency caches outside the source checkout scanned below.
          PRE_COMMIT_HOME: ${{ runner.temp }}/hankoshell-pre-commit
        run: make hooks-check
      - name: Compare visible GitHub protections with reviewed exports
        if: inputs.release != true && (github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_rulesets.py --live --allow-hidden-bypass
      - name: Validate unit tests, chart, architecture, lint and vulnerabilities
        if: inputs.release != true
        run: make test chart-check arch lint vuln
      - name: Enforce package and security function coverage floors
        if: inputs.release != true
        run: python3 -m tools.qualification.checks.check_coverage --profile .tools/runs/tests/unit/coverage.out
      - name: Enforce the dependency license policy and shipped notices
        if: inputs.release != true
        run: make licenses
      - name: Preserve Go test outcomes
        if: inputs.release != true && (always())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Qualify the real experimental authentik adapter and portable corpus
        if: inputs.release != true
        id: authentik
        run: |
          make authentik-integration-test
          go vet -tags=authentik_integration ./internal/controller
          make lint LINT_BUILD_TAGS=authentik_integration
      - name: Preserve real experimental provider outcomes
        if: inputs.release != true && (always() && steps.authentik.outcome != 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-authentik-2026.8.4-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/authentik-2026.8.4/
          if-no-files-found: error
      - name: Cross-compile both Linux architectures
        if: inputs.release != true
        run: |
          make build GOARCH=amd64
          make build GOARCH=arm64
      - name: Check for exposed credentials
        if: inputs.release != true
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /src --no-banner --redact
  kubernetes:
    if: github.event_name != 'push' && inputs.release != true
    name: Kubernetes ${{ matrix.version }} API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["1.35.0", "1.36.2", "1.37.0"] # versions:kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install recovery CLI dependencies
        run: python3 -m pip install -r tools/requirements.txt
      - name: Install pinned Helm
        run: |
          python3 -m tools.bootstrap.install helm --directory /tmp/linux-amd64
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Qualify CRDs, server-side apply, RBAC and Restricted admission
        run: make integration-test KUBERNETES_VERSION=${{ matrix.version }}
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-kubernetes-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Lint integration test code
        if: matrix.version == '1.37.0' # versions:kubernetes-lint
        run: make lint LINT_BUILD_TAGS=integration
  keycloak:
    if: github.event_name != 'push' && inputs.release != true
    name: Keycloak ${{ matrix.version }} / ${{ matrix.shard }} Admin API and security
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["26.8.1", "26.7.5"] # versions:keycloak
        shard: [core, adoption, protocols]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch pinned Keycloak before starting the scenario
        timeout-minutes: 5
        run: make keycloak-fixture-image KEYCLOAK_VERSION=${{ matrix.version }}
      - name: Qualify reconcilers against the real HTTPS Admin API
        run: make keycloak-integration-test KEYCLOAK_VERSION=${{ matrix.version }} KEYCLOAK_SHARD=${{ matrix.shard }}
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-keycloak-${{ matrix.version }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  keycloak-ordinary:
    if: github.event_name != 'push' && inputs.release != true
    name: Keycloak ${{ matrix.version }} tagged ordinary race tests
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["26.8.1", "26.7.5"] # versions:keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Preserve every ordinary test with the native build tag
        run: make keycloak-integration-test KEYCLOAK_VERSION=${{ matrix.version }} KEYCLOAK_SHARD=ordinary
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-keycloak-${{ matrix.version }}-ordinary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  keycloak-extension:
    if: github.event_name != 'push'
    name: Bounded delegation extension KC ${{ matrix.version }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["26.8.1", "26.7.5"] # versions:keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned Keycloak before starting the scenario
        timeout-minutes: 5
        run: make keycloak-fixture-image KEYCLOAK_VERSION=${{ matrix.version }}
      - name: Build the matching SPI and qualify native delegated tokens
        run: make keycloak-extension-test KEYCLOAK_VERSION=${{ matrix.version }}
      - name: Preserve Go test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-tests-keycloak-extension-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/runs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Java test and artifact identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Dependents may be rerun without rebuilding the successful provider job.
          name: keycloak-extension-java-${{ matrix.version }}-${{ github.run_id }}
          overwrite: true
          path: |
            .tools/cache/keycloak-bounded-delegation/*/target/${{ matrix.version }}/build.json
            .tools/cache/keycloak-bounded-delegation/*/target/${{ matrix.version }}/bounded-delegation-keycloak-${{ matrix.version }}.jar
            .tools/cache/keycloak-bounded-delegation/*/target/${{ matrix.version }}/surefire-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  keycloak-static:
    if: github.event_name != 'push' && inputs.release != true
    name: Keycloak tagged vet and lint
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and lint every Keycloak-tagged package
        run: |
          go vet -tags=keycloak_integration,keycloak_extension_integration ./...
          make lint LINT_BUILD_TAGS=keycloak_integration,keycloak_extension_integration
  workload:
    if: github.event_name != 'push' && inputs.release != true
    name: Workload identity KC ${{ matrix.keycloak }} / K8s ${{ matrix.kubernetes }}
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
