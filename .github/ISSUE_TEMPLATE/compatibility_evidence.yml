name: Public release compatibility evidence
description: Report an observed installation, upgrade, rollback or incident without private data.
title: "[Compatibility evidence]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for actual published operator versions. Development qualification is tracked separately.
        Reports are public and voluntary. Do not paste logs, YAML, tokens, Secrets, realm/client names,
        hostnames, user identities, company names or other tenant data. Use abstract scenario descriptions.
        Maintainers review and sanitize reports before adding them to the evidence registry.
  - type: input
    id: installation
    attributes:
      label: Anonymous installation reference
      description: Use installation- followed by 16 random hexadecimal digits. Reuse it for this installation; do not derive it from a tenant or cluster identifier.
      placeholder: installation-0123456789abcdef
    validations:
      required: true
  - type: input
    id: from_version
    attributes:
      label: Source operator version
      description: Exact public version, without v. For an initial installation, repeat the target version.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: to_version
    attributes:
      label: Target operator version
      description: Exact published public version, without v; development builds do not count as production history.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      description: Exact major.minor.patch only; omit cluster names and distribution identifiers.
    validations:
      required: true
  - type: input
    id: keycloak
    attributes:
      label: Keycloak version
      description: Exact major.minor.patch only.
    validations:
      required: true
  - type: input
    id: observed_on
    attributes:
      label: Observation date
      description: YYYY-MM-DD, without names or other identifying details.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Installation mode
      options: [standalone, connected]
    validations:
      required: true
  - type: dropdown
    id: resources
    attributes:
      label: Resources actually exercised
      multiple: true
      options: [HankoApplication, HankoEmailProvider, HankoIAMProfile, HankoImport, HankoIssuer, HankoKeycloakInstance, HankoMeshService, HankoOperation, HankoOrganization, HankoRealm, HankoResourceServer, HankoRole, HankoServiceAccount, HankoSnapshot, HankoTenant, HankoTheme, HankoWorkloadTrust]
    validations:
      required: true
  - type: dropdown
    id: scenarios
    attributes:
      label: Scenarios actually observed
      multiple: true
      options: [installation, upgrade, rollback, adoption, rotation, migration, recovery]
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Observed outcome
      options: [pass, failed, limited]
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Abstract observations, incidents and migration limitations
      description: Describe expected and observed behavior without identifiers or raw dumps. Link existing repository issue numbers for incidents and their resolutions. State whether rollback was actually attempted and its result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report sanitization
      options:
        - label: I removed credentials, tokens, private keys and Secret values.
          required: true
        - label: I removed personal identifiers, tenant data, hostnames and native object names.
          required: true
        - label: I included no raw logs, manifests, screenshots or configuration dumps.
          required: true
        - label: The installation reference is anonymous and randomly generated.
          required: true
        - label: The versions and scenarios describe actual published releases and observations.
          required: true
