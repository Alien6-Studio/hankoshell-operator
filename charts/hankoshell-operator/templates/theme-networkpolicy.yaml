{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hanko-operator.fullname" . }}-theme-jobs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hanko-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: hanko.sh/theme
        operator: Exists
  policyTypes:
    - Egress
  # The builder image contains npm and Maven dependencies. Theme Jobs need
  # only the mounted providers PVC and therefore receive no network access.
  egress: []
{{- end }}
