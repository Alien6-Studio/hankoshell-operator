apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hanko-operator.fullname" . }}-node-reader
  labels:
    {{- include "hanko-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hanko-operator.fullname" . }}-node-reader
  labels:
    {{- include "hanko-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hanko-operator.fullname" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "hanko-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
