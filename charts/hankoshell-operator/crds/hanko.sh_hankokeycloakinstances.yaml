                  reconciliation.
                format: date-time
                type: string
              nextCredentialRotation:
                description: NextCredentialRotation is the deadline derived from HANKO_KC_SA_MAX_AGE.
                format: date-time
                type: string
              phase:
                description: 'Phase: Pending | Probing | Ready | Degraded | Error'
                enum:
                - Pending
                - Probing
                - Ready
                - Degraded
                - Error
                type: string
              realmCount:
                description: RealmCount is the number of realms discovered in this
                  Keycloak instance.
                type: integer
            type: object
