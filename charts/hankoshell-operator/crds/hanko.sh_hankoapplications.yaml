---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: hankoapplications.hanko.sh
spec:
  group: hanko.sh
  names:
    categories:
    - hanko
    kind: HankoApplication
    listKind: HankoApplicationList
    plural: hankoapplications
    shortNames:
    - happ
    singular: hankoapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .spec.clientID
      name: ClientID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HankoApplication represents an OIDC application registered in
          a Keycloak realm.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HankoApplicationSpec defines the desired state of an OIDC
              application.
            properties:
              attributes:
                additionalProperties:
                  type: string
                description: |-
                  Attributes sets arbitrary Keycloak client attributes (single string value per
                  key). The full map is the desired state and replaces unmanaged keys set
                  directly in Keycloak on every reconcile. Keys reserved by the operator for
                  other spec fields (login_theme, post.logout.redirect.uris) are rejected.
                type: object
              clientID:
                description: ClientID is the Keycloak client identifier.
                type: string
              clientSecretProjections:
                description: |-
                  ClientSecretProjections copies the operator-managed client secret into
                  dedicated, pre-provisioned Secrets in workload namespaces. Projections are
                  reconciled on every rotation and cleared with this application. Existing
                  Secrets not explicitly pre-authorized for this application are never
                  adopted or overwritten.
                items:
                  description: |-
                    ApplicationSecretProjection selects a dedicated workload Secret that receives
                    the confidential OIDC client secret under the client_secret key.
                  properties:
                    name:
                      description: Name is the dedicated Secret name in the target
                        namespace.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: Namespace is the workload namespace that receives
                        the projected Secret.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              identityMappings:
                description: |-
                  IdentityMappings maps claims received from an upstream OIDC identity provider
                  to Keycloak realm roles, roles owned by this client, or user attributes.
                  The mapper itself is realm-scoped in Keycloak but is lifecycle-owned by this application.
                items:
                  description: |-
                    ApplicationIdentityMapping describes an inbound OIDC broker mapper owned by
                    a HankoApplication.
                  properties:
                    claim:
                      description: Claim is the upstream OIDC claim to inspect or
                        import, for example "groups".
                      type: string
                    identityProvider:
                      description: IdentityProvider is the Keycloak identity-provider
                        alias, for example "entra".
                      type: string
                    keycloakName:
                      description: |-
                        KeycloakName explicitly adopts an existing mapper by name. When omitted,
                        the operator derives an application-namespaced mapper name. Use this only
                        for deliberate migration of a pre-existing mapper.
                      type: string
                    matchValue:
                      description: |-
                        MatchValue is required for role targets and is the exact claim value that
                        grants the role. For array claims, Keycloak matches when the array contains it.
                        It is omitted for userAttribute targets, which import the complete claim value.
                      type: string
                    name:
                      description: |-
                        Name is unique within this application and is used to derive a stable
                        operator-owned Keycloak mapper name.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    syncMode:
                      default: FORCE
                      description: SyncMode controls updates when an already-linked
                        user logs in again.
                      enum:
                      - IMPORT
                      - FORCE
                      - LEGACY
                      - INHERIT
                      type: string
                    target:
                      description: Target selects exactly one Keycloak destination.
                      properties:
                        clientRole:
                          description: |-
                            ClientRole grants a role owned by this HankoApplication. The role should
                            also be declared in spec.roles.
                          type: string
                        realmRole:
                          description: RealmRole grants an existing realm role when
                            the claim matches.
                          maxLength: 255
                          type: string
                        userAttribute:
                          description: |-
                            UserAttribute imports the upstream claim into this Keycloak user attribute.
                            Because Keycloak users are realm-scoped, the persisted attribute is global;
                            spec.tokenClaims controls which applications receive it in tokens.
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of realmRole, clientRole or userAttribute
                          must be set
                        rule: '(has(self.realmRole) ? 1 : 0) + (has(self.clientRole)
                          ? 1 : 0) + (has(self.userAttribute) ? 1 : 0) == 1'
                      - message: reserved platform, fleet and cluster roles cannot
                          be granted by an application identity mapping
                        rule: '!has(self.realmRole) || (self.realmRole != ''HANKO_PLATFORM''
                          && !self.realmRole.startsWith(''HANKO_PLATFORM_'') && !self.realmRole.startsWith(''HANKO_FLEET_'')
                          && !self.realmRole.startsWith(''HANKO_CLUSTER_''))'
                  required:
                  - claim
                  - identityProvider
                  - name
                  - target
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              mode:
                default: Manage
                description: |-
                  Mode controls the operator's write authority over the underlying Keycloak client.

                  Manage: the operator creates, updates and deletes the client, and owns its
                  lifecycle (client secret, roles, finalizer-gated deletion).

                  Observe: the operator only reads the client to report status. It never creates,
                  updates, or deletes the client in Keycloak, and never reads or stores its secret.
                  Objects carrying the hanko.sh/imported-by label are always treated as Observe,
                  regardless of this field, for backward compatibility with pre-existing imports.
                enum:
                - Manage
                - Observe
                type: string
              postLogoutRedirectURIs:
                description: PostLogoutRedirectURIs is the list of allowed URIs after
                  logout.
                items:
                  type: string
                type: array
              realmRef:
                description: RealmRef references the HankoRealm this application belongs
                  to.
                type: string
              realmRoleScopes:
                description: |-
                  RealmRoleScopes is the exact set of realm roles allowed into tokens issued
                  to this client while Keycloak fullScopeAllowed remains disabled. When the
                  field is omitted, existing realm-role scope mappings remain unmanaged.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              redirectURIs:
                description: RedirectURIs is the list of allowed redirect URIs after
                  authentication.
                items:
                  type: string
                type: array
              roles:
                description: |-
                  Roles lists client roles to create in Keycloak alongside this application.
                  Roles are scoped to this client and deleted automatically when the client is deleted.
                items:
                  description: ApplicationRole describes a Keycloak client role managed
                    by the operator.
                  properties:
                    description:
                      description: Description is an optional human-readable description.
                      type: string
                    name:
                      description: Name is the Keycloak client role name.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              secretRotationPolicy:
                description: |-
                  SecretRotationPolicy controls rotation for confidential web and m2m
                  clients. It is ignored for public SPA clients and Observe-mode objects.
                properties:
                  enabled:
                    description: Enabled activates automatic rotation.
                    type: boolean
                  forceRotateAt:
                    description: ForceRotateAt, when set, triggers an immediate rotation
                      on the next reconcile.
                    format: date-time
                    type: string
                  intervalDays:
                    description: IntervalDays is the rotation period in days.
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              theme:
                description: Theme references a HankoTheme to apply to this application's
                  login page.
                type: string
              tokenClaims:
                description: |-
                  TokenClaims exposes a Keycloak user attribute or a fixed value as a claim only
                  in tokens issued to this application. These are client-scoped protocol mappers.
                items:
                  description: |-
                    ApplicationTokenClaim describes a client-scoped OIDC protocol mapper. Only
                    the typed mapper forms below are supported; arbitrary Keycloak mapper
                    implementations and reserved identity/authorization claims fail closed.
                  properties:
                    addToAccessToken:
                      type: boolean
                    addToIDToken:
                      description: |-
                        Token destinations default to true when omitted. Introspection defaults to
                        the access-token setting.
                      type: boolean
                    addToIntrospection:
                      type: boolean
                    addToUserInfo:
                      type: boolean
                    claim:
                      description: |-
                        Claim is the claim name emitted in tokens. Dot notation creates nested claims.
                        The reserved value "aud" with a fixed Value uses Keycloak's native Audience
                        mapper so existing access-token audiences are preserved.
                      maxLength: 255
                      minLength: 1
                      type: string
                    jsonType:
                      default: String
                      description: JSONType controls conversion of the emitted value.
                      enum:
                      - String
                      - long
                      - int
                      - boolean
                      - JSON
                      type: string
                    keycloakName:
                      description: |-
                        KeycloakName explicitly adopts an existing client protocol mapper by name.
                        When omitted, the operator derives a stable application-scoped name.
                      type: string
                    multivalued:
                      description: Multivalued emits all values of a user attribute
                        as an array.
                      type: boolean
                    name:
                      description: Name is unique within this application.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    realmRolePrefix:
                      description: |-
                        RealmRolePrefix, when set, restricts and strips a prefix from the projected
                        realm-role names. Only meaningful together with realmRoles.
                      type: string
                    realmRoles:
                      description: |-
                        RealmRoles projects the caller's realm roles into this claim as a
                        multivalued array (Keycloak's realm-role user-model mapper). It is the
                        substrate for hierarchical-org role projection (HKX-09): a member inherits
                        realm roles from their organization group, and this claim carries them to
                        the consuming application (e.g. Trunx reads "trunx_roles"). Exactly one of
                        userAttribute, value or realmRoles must be set.
                      type: boolean
                    userAttribute:
                      description: |-
                        UserAttribute reads the value from a Keycloak user attribute.
                        Exactly one of userAttribute and value must be set.
                      type: string
                    value:
                      description: |-
                        Value emits a fixed application-specific claim value. A pointer allows an
                        explicitly configured empty string to remain distinguishable from omission.
                      type: string
                  required:
                  - claim
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of userAttribute, value or realmRoles must
                      be set
                    rule: '[has(self.userAttribute), has(self.value), has(self.realmRoles)].exists_one(x,
                      x)'
                  - message: reserved identity and authorization claims cannot be
                      overridden
                    rule: self.claim != 'sub' && self.claim != 'iss' && self.claim
                      != 'exp' && self.claim != 'iat' && self.claim != 'nbf' && self.claim
                      != 'jti' && self.claim != 'azp' && self.claim != 'typ' && self.claim
                      != 'sid' && self.claim != 'scope' && self.claim != 'session_state'
                      && self.claim != 'nonce' && self.claim != 'auth_time' && self.claim
                      != 'acr' && self.claim != 'amr' && self.claim != 'at_hash' &&
                      self.claim != 'c_hash' && self.claim != 's_hash' && self.claim
                      != 'client_id' && self.claim != 'hanko_token_use' && self.claim
                      != 'realm_access' && !self.claim.startsWith('realm_access.')
                      && self.claim != 'resource_access' && !self.claim.startsWith('resource_access.')
                      && self.claim != 'authorization' && !self.claim.startsWith('authorization.')
                      && self.claim != 'permissions' && !self.claim.startsWith('permissions.')
                      && self.claim != 'https://hanko.sh/authorization' && !self.claim.startsWith('https://hanko.sh/authorization.')
                      && self.claim != 'cnf' && !self.claim.startsWith('cnf.') &&
                      self.claim != 'act' && !self.claim.startsWith('act.') && self.claim
                      != 'may_act' && !self.claim.startsWith('may_act.') && self.claim
                      != 'authorization_details' && !self.claim.startsWith('authorization_details.')
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              type:
                description: Type is the application type.
                enum:
                - spa
                - web
                - m2m
                type: string
            required:
            - clientID
            - realmRef
            type: object
            x-kubernetes-validations:
            - message: clientSecretProjections require a confidential web or m2m client
              rule: '!has(self.clientSecretProjections) || self.type == ''web'' ||
                self.type == ''m2m'''
            - message: clientSecretProjections require Manage mode
              rule: '!has(self.clientSecretProjections) || !has(self.mode) || self.mode
                != ''Observe'''
            - message: built-in Keycloak clients cannot be managed as HankoApplication
              rule: self.clientID.trim() != 'account' && self.clientID.trim() != 'account-console'
                && self.clientID.trim() != 'admin-cli' && self.clientID.trim() !=
                'broker' && self.clientID.trim() != 'realm-management' && self.clientID.trim()
                != 'security-admin-console'
          status:
            description: HankoApplicationStatus describes the observed state of the
              application.
            properties:
              clientSecret:
                description: |-
                  ClientSecret references the K8s Secret holding the OIDC client secret.
                  Only set for confidential clients (web, m2m).
                properties:
                  secretRef:
                    description: SecretKeySelector selects a key of a Secret.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - secretRef
                type: object
              conditions:
                description: Conditions holds standard Kubernetes condition objects.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastReconciled:
                description: LastReconciled is the timestamp of the last successful
                  reconciliation.
                format: date-time
                type: string
              lastRotated:
                description: LastRotated is the timestamp of the last confidential
                  client secret rotation.
                format: date-time
                type: string
              managedClientSecretProjections:
                description: |-
                  ManagedClientSecretProjections records the exact workload Secrets whose
                  client_secret value is lifecycle-managed by this application.
                items:
                  description: |-
                    ApplicationSecretProjection selects a dedicated workload Secret that receives
                    the confidential OIDC client secret under the client_secret key.
                  properties:
                    name:
                      description: Name is the dedicated Secret name in the target
                        namespace.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: Namespace is the workload namespace that receives
                        the projected Secret.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              managedIdentityMappings:
                description: |-
                  ManagedIdentityMappings records realm-scoped identity-provider mappers
                  lifecycle-owned by this application.
                items:
                  description: |-
                    ManagedIdentityMappingReference reports the desired identity-provider mapper's
                    reconciliation state. KeycloakID is set once the operator owns an external mapper.
                  properties:
                    conditions:
                      description: Conditions reports this mapper's individual reconciliation
                        state.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    identityProvider:
                      type: string
                    keycloakID:
                      type: string
                    name:
                      type: string
                  required:
                  - identityProvider
                  - keycloakID
                  - name
                  type: object
                type: array
              managedTokenClaims:
                description: ManagedTokenClaims records client-scoped protocol mappers
                  managed for this application.
                items:
                  description: |-
                    ManagedTokenClaimReference reports the desired client protocol mapper's
                    reconciliation state. KeycloakID is set once the operator owns an external mapper.
                  properties:
                    conditions:
                      description: Conditions reports this mapper's individual reconciliation
                        state.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    keycloakID:
                      type: string
                    name:
                      type: string
                  required:
                  - keycloakID
                  - name
                  type: object
                type: array
              nextRotation:
                description: NextRotation is the next scheduled secret rotation, when
                  configured.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation fully evaluated by
                  the reconciler. Deployment automation uses it with Phase=Ready to avoid
                  accepting stale status from an earlier application specification.
                format: int64
                type: integer
              oidcEndpoints:
                description: OIDCEndpoints holds the Keycloak OIDC endpoint URLs for
                  this application.
                properties:
                  authorization:
                    type: string
                  issuer:
                    type: string
                  jwks:
                    type: string
                  token:
                    type: string
                  userInfo:
                    type: string
                type: object
              phase:
                description: Phase summarises the reconciliation state.
                enum:
                - Pending
                - Reconciling
                - Ready
                - Error
                - Conflict
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
