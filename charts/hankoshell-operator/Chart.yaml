apiVersion: v2
name: hankoshell-operator
description: Manage Keycloak sign-in, service accounts and access policies from Kubernetes
type: application
version: "1.2.3"
appVersion: "1.2.3"
kubeVersion: ">=1.35.0-0 <1.38.0-0"
keywords:
  - oidc
  - keycloak
  - operator
  - identity
home: https://hanko.sh
icon: https://raw.githubusercontent.com/Alien6-Studio/hankoshell-operator/main/charts/hankoshell-operator/icon.svg
sources:
  - https://github.com/Alien6-Studio/hankoshell-operator
maintainers:
  - name: Alien6 Studio
    url: https://github.com/Alien6-Studio
annotations:
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: added
      description: Grant declared realm roles to the service account of a machine-to-machine application.
    - kind: changed
      description: Update Kubernetes client libraries to v0.37.2 and the Go base image.
    - kind: changed
      description: Wait for the administrator approval of an OLM installation instead of exiting; the Keycloak credentials Secret reference is optional at pod creation.
  artifacthub.io/images: |
    - name: hankoshell-operator
      image: ghcr.io/alien6-studio/hankoshell-operator:1.2.3
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Alien6-Studio/hankoshell-operator
    - name: Security policy
      url: https://github.com/Alien6-Studio/hankoshell-operator/blob/main/SECURITY.md
