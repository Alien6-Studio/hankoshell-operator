apiVersion: v2
name: hankoshell-operator
description: Declarative IAM reconciliation for Keycloak and hankoShell platform integrations
type: application
version: "1.0.0-rc.1"
appVersion: "1.0.0-rc.1"
kubeVersion: ">=1.35.0-0 <1.38.0-0"
keywords:
  - oidc
  - keycloak
  - operator
  - identity
home: https://hanko.sh
icon: https://raw.githubusercontent.com/Alien6-Studio/hankoshell-operator/d1e3555fd64e3ac25a3b2c364ab936608754b41a/charts/hankoshell-operator/icon.svg
sources:
  - https://github.com/Alien6-Studio/hankoshell-operator
maintainers:
  - name: Alien6 Studio
    url: https://github.com/Alien6-Studio
annotations:
  licenses: Apache-2.0
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Package 1.0.0-rc.1 for qualification, including existing-installation recovery and rotation checkpoint preservation; APIs remain experimental and stable publication remains blocked.
    - kind: fixed
      description: Bind the private Ed25519 signer to its approved public key and canonical Attest identity before publication; qualify TSA structure and adversarial retries without changing IAM behavior.
    - kind: added
      description: Add reviewed leaf and aggregate adoption with owner-only receipts and selective ResourceServer V2 journals.
    - kind: added
      description: Preserve qualified native state during explicit Manage and refuse unsafe foreign/shared cleanup.
    - kind: changed
      description: Complete reviewed adoption, native preservation and explicit target-realm role-writer authority as the implemented adoption foundation; public distribution remains pending.
  artifacthub.io/images: |
    - name: hankoshell-operator
      image: ghcr.io/alien6-studio/hankoshell-operator:1.0.0-rc.1
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Alien6-Studio/hankoshell-operator
    - name: Security policy
      url: https://github.com/Alien6-Studio/hankoshell-operator/blob/main/SECURITY.md
