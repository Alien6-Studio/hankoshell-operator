apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: KEYCLOAK_IMAGE
          args:
            - start-dev
            - --http-enabled=false
            - --http-management-scheme=http
            - --hostname=https://keycloak.auth.svc:8443
            - --https-protocols=TLSv1.3
            - --https-certificate-file=/tls/tls.crt
            - --https-certificate-key-file=/tls/tls.key
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: demo-admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-bootstrap, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: data, mountPath: /opt/keycloak/data}
      volumes:
        - name: tls
          secret: {secretName: keycloak-tls, defaultMode: 288}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: https, port: 8443, targetPort: 8443}
