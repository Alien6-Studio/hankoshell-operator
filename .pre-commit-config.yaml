minimum_pre_commit_version: '4.7.0'
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]
        # Generated notices exceed the cap; make licenses checks them for drift.
        exclude: ^THIRD_PARTY_NOTICES
      - id: detect-private-key
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are validated by the existing chart gate.
        exclude: ^charts/hankoshell-operator/templates/
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: go-format
        name: Go formatting (make fmt-check)
        entry: make fmt-check
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: Go vet (changed packages)
        entry: python3 -m tools.quality.pre_commit_checks vet
        language: system
        files: (\.go$|^go\.(mod|sum)$)
        require_serial: true
      - id: go-architecture
        name: Go architecture (make arch)
        entry: make arch
        language: system
        files: (\.go$|^go\.(mod|sum)$|^\.go-arch-lint\.yml$)
        pass_filenames: false
      - id: staged-secrets
        name: Gitleaks (staged changes)
        entry: python3 -m tools.quality.pre_commit_checks secrets
        language: system
        always_run: true
        pass_filenames: false
      - id: python-tests
        name: Qualification tooling tests
        entry: python3 -m unittest discover -s tests/tooling -t . -p test_*.py
        language: system
        files: ^(tools/.*\.(py|sh)|tools/requirements\.txt|tests/(tooling|chart)/.*\.(py|sh))$
        pass_filenames: false
