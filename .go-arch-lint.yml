# go-arch-lint v3 — repository root (module: github.com/Alien6-Studio/hankoshell-operator)
# Rules derived from ADR-009 and ADR-010.
# Run: go-arch-lint check  (from repository root/)
version: 3
workdir: .

allow:
  depOnAnyVendor: true

excludeFiles:
  - ".+_test\\.go"

components:
  cmd:
    in: "/cmd/operator"
  fixture_review:
    in: "/scripts/workload-auth-review"
  api_surface:
    in: "/scripts/api-surface"
  api_surface_fixture:
    in: "/scripts/api-surface/testdata/contract"
  controller:
    in: "/internal/controller"
  keycloak:
    in: "/internal/keycloak"
  authentik:
    in: "/internal/authentik"
  observability:
    in: "/internal/observability"
  httpsecurity:
    in: "/internal/httpsecurity"
  iamconformance:
    in: "/internal/iamconformance"
  adoption:
    in: "/internal/adoption"
  iamcontract:
    in: "/internal/iamcontract"
  roles:
    in: "/internal/roles"
  workloadtrust:
    in: "/internal/workloadtrust"
  workloadauth:
    in: "/internal/workloadauth"
  workloadbinding:
    in: "/internal/workloadbinding"
  applications:
    in: "/internal/applications"
  applicationbinding:
    in: "/internal/applicationbinding"
  organization:
    in: "/internal/organization"
  authorization:
    in: "/internal/authorization"
  hub:
    in: "/internal/hub"
  fleetplan:
    in: "/internal/fleetplan"
  api_types:
    in: "/api/v1alpha1"
  imagevalidator:
    in: "/internal/imagevalidator"
  supervision:
    in: "/internal/supervision"
  hankoapi:
    in: "/internal/hankoapi"
  decommission:
    in: "/internal/decommission"
  selfupdate:
    in: "/internal/selfupdate"
  version:
    in: "/internal/version"

deps:
  observability:
    anyVendorDeps: true
  # cmd/ wires everything — no restriction.
  cmd:
    anyProjectDeps: true
  fixture_review:
    mayDependOn:
      - workloadauth

  # ADR-009: Reconcilers may use the Keycloak client, Hub client, CRD types,
  # and the image validator (ADR-017).
  controller:
    mayDependOn:
      - observability
      - httpsecurity
      - workloadtrust
      - workloadbinding
      - workloadauth
      - keycloak
      - authentik
      - authorization
      - organization
      - roles
      - applications
      - applicationbinding
      - iamcontract
      - adoption
      - hub
      - fleetplan
      - api_types
      - imagevalidator
      - supervision
      - hankoapi
      - decommission
      - selfupdate
      - version

  # ADR-009: HTTP client depends on transport and pure ownership wire contracts.
  keycloak:
    anyVendorDeps: true
    mayDependOn:
      - workloadtrust
      - workloadauth
      - observability
      - httpsecurity
      - adoption
      - organization

  authentik:
    mayDependOn:
      - observability
      - httpsecurity
      - iamcontract
      - applications

  httpsecurity:
    anyVendorDeps: true

  # ADR-029: Provider-neutral authorization drivers may adapt provider clients.
  iamconformance:
    mayDependOn:
      - iamcontract

  adoption:
    mayDependOn:
      - iamcontract

  iamcontract:
    anyVendorDeps: true

  roles:
    mayDependOn:
      - keycloak
      - iamcontract
      - adoption

  workloadtrust:
    mayDependOn:
      - iamcontract
      - httpsecurity
  workloadauth:
    mayDependOn:
      - iamcontract
  workloadbinding:
    mayDependOn:
      - api_types
      - iamcontract

  applications:
    mayDependOn:
      - keycloak
      - iamcontract
      - adoption

  applicationbinding:
    mayDependOn:
      - api_types
      - iamcontract

  organization:
    anyVendorDeps: true

  authorization:
    mayDependOn:
      - organization
      - keycloak
      - iamcontract

  # ADR-010: Hub client carries the bounded supervision DTO in heartbeats.
  hub:
    mayDependOn:
      - supervision

  fleetplan:
    mayDependOn:
      - httpsecurity
      - iamcontract

  # ADR-009 and ADR-010: CRD type definitions have no runtime project dependencies.
  api_types:
    anyVendorDeps: true

  # Image validation only adds the bounded operational telemetry leaf.
  imagevalidator:
    anyVendorDeps: true
    mayDependOn:
      - observability

  # Supervision reads operator CRDs and exposes a bounded transport DTO.
  supervision:
    mayDependOn:
      - api_types
      - httpsecurity
      - iamcontract

  # Organization position projector is a pure HTTP client of the hankoShell API.
  hankoapi:
    anyVendorDeps: true
    mayDependOn:
      - httpsecurity

  # ADR-010: decommission and self-update flows report through the Hub client.
  decommission:
    mayDependOn:
      - hub

  selfupdate:
    mayDependOn:
      - hub

  # Build/version metadata is a standalone leaf package.
  version:
    anyVendorDeps: true
