apiVersion: v1
kind: Namespace
metadata:
  name: hanko-recovery-audit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hanko-finalizer-release-audit
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Exact
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [configmaps]
        scope: Namespaced
  matchConditions:
    - name: dedicated-audit-namespace
      expression: request.namespace == 'hanko-recovery-audit'
  validations:
    - expression: request.operation == 'CREATE'
      message: Finalizer release audit records cannot be updated or deleted
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' ||
        (has(object.immutable) && object.immutable && !has(object.binaryData) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences.size() == 0) &&
        has(object.data) && object.data.size() == 6 &&
        ['format', 'phase', 'digest', 'actor', 'requestor', 'payload'].all(k, k in object.data) &&
        object.data.format == 'hanko.sh/finalizer-release/v1alpha1' &&
        object.data.phase in ['request', 'approval', 'intent', 'receipt'] &&
        object.data.digest.matches('^[0-9a-f]{64}$') &&
        object.metadata.name == 'hanko-release-' + object.data.digest + '-' + object.data.phase &&
        object.data.payload.size() <= 32768 && object.data.requestor.size() > 0 && object.data.requestor.size() <= 1024 &&
        object.data.actor == request.userInfo.username && !request.userInfo.username.startsWith('system:') &&
        (object.data.phase == 'approval' ?
          (request.userInfo.groups.exists(g, g == 'hanko:recovery-approvers') && object.data.actor != object.data.requestor) :
          (request.userInfo.groups.exists(g, g == 'hanko:recovery-executors') && object.data.actor == object.data.requestor)))
      message: Finalizer release requires authenticated independent administrator provenance
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hanko-finalizer-release-audit
spec:
  policyName: hanko-finalizer-release-audit
  validationActions: [Deny, Audit]
